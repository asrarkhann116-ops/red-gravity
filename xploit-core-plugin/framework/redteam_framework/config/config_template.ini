# OPERATION CONFIGURATION TEMPLATE
# =================================
# Copy and customize per operation

[operation]
name = "OP_DEFAULT"
codename = "PHANTOM"
start_date = "2024-01-01"
end_date = "2024-12-31"

[target]
organization = "TARGET_NAME"
domain = "target.com"
ip_range = "10.0.0.0/24"
scope = "external"

[c2]
primary_channel = "https"
backup_channel = "dns"
beacon_interval = 300
jitter_percent = 20
domain_fronting = false

[stealth]
amsi_bypass = true
etw_patch = true
sandbox_check = true
sleep_obfuscate = true

[exfil]
max_file_size = "10MB"
encryption = "aes256"
compression = true
channels = ["https", "dns"]

[logging]
level = "INFO"
local_storage = false
remote_endpoint = ""
