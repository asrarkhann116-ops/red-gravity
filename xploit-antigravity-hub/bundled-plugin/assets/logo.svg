<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0b0f19" />
  <!-- Hexagon grid subtle background -->
  <polygon points="128,24 216,72 216,184 128,232 40,184 40,72" fill="none" stroke="#1f293d" stroke-width="3" />
  <polygon points="128,48 194,86 194,170 128,208 62,170 62,86" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.3" />
  <!-- Skull / Biohazard stylized motif -->
  <path d="M128 65 C95 65 80 90 80 120 C80 145 95 165 110 175 L110 190 L146 190 L146 175 C161 165 176 145 176 120 C176 90 161 65 128 65 Z" fill="none" stroke="url(#cyberGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBlur)" />
  <!-- Eye sockets -->
  <circle cx="106" cy="120" r="10" fill="#00ff88" />
  <circle cx="150" cy="120" r="10" fill="#00ff88" />
  <!-- Cyber crosshair accents -->
  <line x1="128" y1="20" x2="128" y2="45" stroke="#00ff88" stroke-width="4" stroke-linecap="round" />
  <line x1="128" y1="211" x2="128" y2="236" stroke="#00ff88" stroke-width="4" stroke-linecap="round" />
  <line x1="20" y1="128" x2="45" y2="128" stroke="#00b4d8" stroke-width="4" stroke-linecap="round" />
  <line x1="211" y1="128" x2="236" y2="128" stroke="#00b4d8" stroke-width="4" stroke-linecap="round" />
  <!-- Teeth / Grate -->
  <line x1="118" y1="182" x2="118" y2="190" stroke="#00ff88" stroke-width="3" stroke-linecap="round" />
  <line x1="128" y1="182" x2="128" y2="190" stroke="#00ff88" stroke-width="3" stroke-linecap="round" />
  <line x1="138" y1="182" x2="138" y2="190" stroke="#00ff88" stroke-width="3" stroke-linecap="round" />
</svg>

